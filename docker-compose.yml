services:

  app:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./vector_db:/app/vector_db
      - ./configs:/app/configs
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASS=sudhendra@123
      - OLLAMA_HOST=http://host.docker.internal:11434
    depends_on:
      neo4j:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  neo4j:
    image: neo4j:enterprise
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/sudhendra@123
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=eval
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p sudhendra@123 'RETURN 1' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 40s

volumes:
  neo4j_data:
